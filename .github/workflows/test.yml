name: Test

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/**"

jobs:
  write-formula:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test write-formula
        run: scripts/write-formula-test
