name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CICD_PAT }}

      - name: Update Formula
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          TOOL="${{ github.event.client_payload.tool }}"

          # Validate tool parameter
          if [ -z "$TOOL" ]; then
            echo "Error: tool parameter is required"
            exit 1
          fi

          # Set formula file and repository based on tool
          if [ "$TOOL" = "bash-toolkit" ]; then
            FORMULA_FILE="Formula/bash-toolkit.rb"
            REPO="leeovery/bash-toolkit"
            SHA256="${{ github.event.client_payload.sha256 }}"
            ASSET_ID="${{ github.event.client_payload.asset_id }}"

            RELEASE_URL="https://github.com/$REPO/releases/download/v$VERSION/$TOOL-v$VERSION.tar.gz"

            sed -i "s/version \".*\"/version \"$VERSION\"/" $FORMULA_FILE
            sed -i "s|url \".*\"|url \"$RELEASE_URL\"|" $FORMULA_FILE
            sed -i "s/sha256 \".*\"/sha256 \"$SHA256\"/" $FORMULA_FILE

            if grep -q "\"$VERSION\" =>" $FORMULA_FILE; then
              sed -i "s/\"$VERSION\" => \"[^\"]*\"/\"$VERSION\" => \"$ASSET_ID\"/" $FORMULA_FILE
            else
              sed -i "/asset_ids = {/a\\      \"$VERSION\" => \"$ASSET_ID\"," $FORMULA_FILE
            fi
          elif [ "$TOOL" = "stitch" ]; then
            FORMULA_FILE="Formula/stitch.rb"
            REPO="leeovery/stitch"
            SHA256="${{ github.event.client_payload.sha256 }}"
            ASSET_ID="${{ github.event.client_payload.asset_id }}"

            RELEASE_URL="https://github.com/$REPO/releases/download/v$VERSION/$TOOL-v$VERSION.tar.gz"

            sed -i "s/version \".*\"/version \"$VERSION\"/" $FORMULA_FILE
            sed -i "s|url \".*\"|url \"$RELEASE_URL\"|" $FORMULA_FILE
            sed -i "s/sha256 \".*\"/sha256 \"$SHA256\"/" $FORMULA_FILE

            if grep -q "\"$VERSION\" =>" $FORMULA_FILE; then
              sed -i "s/\"$VERSION\" => \"[^\"]*\"/\"$VERSION\" => \"$ASSET_ID\"/" $FORMULA_FILE
            else
              sed -i "/asset_ids = {/a\\      \"$VERSION\" => \"$ASSET_ID\"," $FORMULA_FILE
            fi
          elif [ "$TOOL" = "tick" ]; then
            FORMULA_FILE="Formula/tick.rb"
            SHA256_ARM64="${{ github.event.client_payload.sha256_arm64 }}"
            SHA256_AMD64="${{ github.event.client_payload.sha256_amd64 }}"

            sed -i "s/version \".*\"/version \"$VERSION\"/" $FORMULA_FILE

            # Update arm64 sha256
            sed -i "/darwin_arm64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_ARM64\"/; }" $FORMULA_FILE

            # Update amd64 sha256
            sed -i "/darwin_amd64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_AMD64\"/; }" $FORMULA_FILE
          elif [ "$TOOL" = "portal" ]; then
            FORMULA_FILE="Formula/portal.rb"
            SHA256_ARM64="${{ github.event.client_payload.sha256_arm64 }}"
            SHA256_AMD64="${{ github.event.client_payload.sha256_amd64 }}"

            sed -i "s/version \".*\"/version \"$VERSION\"/" $FORMULA_FILE

            # Update arm64 sha256
            sed -i "/darwin_arm64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_ARM64\"/; }" $FORMULA_FILE

            # Update amd64 sha256
            sed -i "/darwin_amd64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_AMD64\"/; }" $FORMULA_FILE
          elif [ "$TOOL" = "mint" ]; then
            FORMULA_FILE="Formula/mint.rb"
            SHA256_ARM64="${{ github.event.client_payload.sha256_arm64 }}"
            SHA256_AMD64="${{ github.event.client_payload.sha256_amd64 }}"

            sed -i "s/version \".*\"/version \"$VERSION\"/" $FORMULA_FILE

            # Update arm64 sha256
            sed -i "/darwin_arm64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_ARM64\"/; }" $FORMULA_FILE

            # Update amd64 sha256
            sed -i "/darwin_amd64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_AMD64\"/; }" $FORMULA_FILE
          else
            echo "Error: unsupported tool '$TOOL'. Supported tools: stitch, bash-toolkit, tick, portal, mint"
            exit 1
          fi

      - name: Commit changes
        run: |
          TOOL="${{ github.event.client_payload.tool }}"
          VERSION="${{ github.event.client_payload.version }}"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if [ "$TOOL" = "bash-toolkit" ]; then
            git add Formula/bash-toolkit.rb
          elif [ "$TOOL" = "stitch" ]; then
            git add Formula/stitch.rb
          elif [ "$TOOL" = "tick" ]; then
            git add Formula/tick.rb
          elif [ "$TOOL" = "portal" ]; then
            git add Formula/portal.rb
          elif [ "$TOOL" = "mint" ]; then
            git add Formula/mint.rb
          fi

          git commit -m "Update $TOOL formula to v$VERSION" || exit 0
          git push
