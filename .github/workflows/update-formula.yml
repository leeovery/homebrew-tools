name: Update Formula
# Names each run by its payload, so a sender (press upload, which kit,
# mint, switchboard, sitrep and spaceman release through) can tell its own
# run from another tool's that started beside it.
run-name: Update ${{ github.event.client_payload.tool }} to v${{ github.event.client_payload.version }}

on:
  repository_dispatch:
    types: [update-formula]

# One update at a time, so two dispatches close together can't race each
# other's git push; a queued one waits rather than being cancelled.
concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # press upload waits on this run, so it must end.
    timeout-minutes: 5
    # Pushing the formula commit back to this repo needs write access, which the
    # built-in GITHUB_TOKEN grants once asked. This repo is the dispatch target,
    # not a sender, so it no longer holds a cross-repo PAT of its own.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Formula
        # The payload through the environment, never spliced into the script.
        env:
          PAYLOAD_TOOL: ${{ github.event.client_payload.tool }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_SHA256: ${{ github.event.client_payload.sha256 }}
          PAYLOAD_SHA256_ARM64: ${{ github.event.client_payload.sha256_arm64 }}
          PAYLOAD_SHA256_AMD64: ${{ github.event.client_payload.sha256_amd64 }}
        run: |
          VERSION="$PAYLOAD_VERSION"
          TOOL="$PAYLOAD_TOOL"

          # Validate tool parameter
          if [ -z "$TOOL" ]; then
            echo "Error: tool parameter is required"
            exit 1
          fi

          # Set formula file and repository based on tool
          if [ "$TOOL" = "bash-toolkit" ]; then
            FORMULA_FILE="Formula/bash-toolkit.rb"
            REPO="leeovery/bash-toolkit"
            SHA256="${{ github.event.client_payload.sha256 }}"
            ASSET_ID="${{ github.event.client_payload.asset_id }}"

            RELEASE_URL="https://github.com/$REPO/releases/download/v$VERSION/$TOOL-v$VERSION.tar.gz"

            sed -i "s/version \".*\"/version \"$VERSION\"/" $FORMULA_FILE
            sed -i "s|url \".*\"|url \"$RELEASE_URL\"|" $FORMULA_FILE
            sed -i "s/sha256 \".*\"/sha256 \"$SHA256\"/" $FORMULA_FILE

            if grep -q "\"$VERSION\" =>" $FORMULA_FILE; then
              sed -i "s/\"$VERSION\" => \"[^\"]*\"/\"$VERSION\" => \"$ASSET_ID\"/" $FORMULA_FILE
            else
              sed -i "/asset_ids = {/a\\      \"$VERSION\" => \"$ASSET_ID\"," $FORMULA_FILE
            fi
          elif [ "$TOOL" = "stitch" ]; then
            # The Go Stitch: an archive for each chip from its private repo,
            # each found by its file name in the release, so only the version
            # and the two sha256s change. Each sha256 is the first after its
            # url. A payload without both, as the bash Stitch sent before it
            # moved to stitch-bash, is refused, never written.
            FORMULA_FILE="Formula/stitch.rb"
            SHA256_ARM64="$PAYLOAD_SHA256_ARM64"
            SHA256_AMD64="$PAYLOAD_SHA256_AMD64"

            if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $SHA256_ARM64 =~ ^[0-9a-f]{64}$ && $SHA256_AMD64 =~ ^[0-9a-f]{64}$ ]]; then
              echo "Error: stitch needs a version X.Y.Z and two sha256s of 64 hex digits, sha256_arm64 and sha256_amd64; got '$VERSION', '$SHA256_ARM64', '$SHA256_AMD64'"
              exit 1
            fi

            sed -i "s/^  version \"[0-9.]*\"$/  version \"$VERSION\"/" $FORMULA_FILE
            sed -i "/darwin_arm64/,/sha256/ s/^    sha256 \"[0-9a-f]*\"$/    sha256 \"$SHA256_ARM64\"/" $FORMULA_FILE
            sed -i "/darwin_amd64/,/sha256/ s/^    sha256 \"[0-9a-f]*\"$/    sha256 \"$SHA256_AMD64\"/" $FORMULA_FILE

            if ! grep -qx "  version \"$VERSION\"" $FORMULA_FILE ||
              ! grep -A2 darwin_arm64 $FORMULA_FILE | grep -qx "    sha256 \"$SHA256_ARM64\"" ||
              ! grep -A2 darwin_amd64 $FORMULA_FILE | grep -qx "    sha256 \"$SHA256_AMD64\""; then
              echo "Error: $FORMULA_FILE has no version or sha256 line where the workflow looks for it"
              exit 1
            fi
          elif [ "$TOOL" = "press" ]; then
            # press's first release, sent by the Python press, as stitch's
            # are: an archive for each chip from its private repo, so only the
            # version and the two sha256s change, each the first after its
            # url. From its next release press sends write-formula.yml the
            # whole formula, and this branch goes.
            FORMULA_FILE="Formula/press.rb"
            SHA256_ARM64="$PAYLOAD_SHA256_ARM64"
            SHA256_AMD64="$PAYLOAD_SHA256_AMD64"

            if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $SHA256_ARM64 =~ ^[0-9a-f]{64}$ && $SHA256_AMD64 =~ ^[0-9a-f]{64}$ ]]; then
              echo "Error: press needs a version X.Y.Z and two sha256s of 64 hex digits, sha256_arm64 and sha256_amd64; got '$VERSION', '$SHA256_ARM64', '$SHA256_AMD64'"
              exit 1
            fi

            sed -i "s/^  version \"[0-9.]*\"$/  version \"$VERSION\"/" $FORMULA_FILE
            sed -i "/darwin_arm64/,/sha256/ s/^    sha256 \"[0-9a-f]*\"$/    sha256 \"$SHA256_ARM64\"/" $FORMULA_FILE
            sed -i "/darwin_amd64/,/sha256/ s/^    sha256 \"[0-9a-f]*\"$/    sha256 \"$SHA256_AMD64\"/" $FORMULA_FILE

            if ! grep -qx "  version \"$VERSION\"" $FORMULA_FILE ||
              ! grep -A2 darwin_arm64 $FORMULA_FILE | grep -qx "    sha256 \"$SHA256_ARM64\"" ||
              ! grep -A2 darwin_amd64 $FORMULA_FILE | grep -qx "    sha256 \"$SHA256_AMD64\""; then
              echo "Error: $FORMULA_FILE has no version or sha256 line where the workflow looks for it"
              exit 1
            fi
          elif [ "$TOOL" = "stitch-bash" ]; then
            # The bash Stitch, under its own name since the Go Stitch took
            # stitch: one archive from its private repo, found by its file name,
            # its version read from the URL.
            FORMULA_FILE="Formula/stitch-bash.rb"
            SHA256="$PAYLOAD_SHA256"

            if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $SHA256 =~ ^[0-9a-f]{64}$ ]]; then
              echo "Error: stitch-bash needs a version X.Y.Z and a sha256 of 64 hex digits; got '$VERSION', '$SHA256'"
              exit 1
            fi

            RELEASE_URL="https://github.com/leeovery/stitch-bash/releases/download/v$VERSION/stitch-v$VERSION.tar.gz"
            sed -i "s|^  url \"https://github.com/leeovery/stitch-bash/[^\"]*\",$|  url \"$RELEASE_URL\",|" $FORMULA_FILE
            sed -i "s/^  sha256 \"[0-9a-f]*\"$/  sha256 \"$SHA256\"/" $FORMULA_FILE

            if ! grep -qx "  url \"$RELEASE_URL\"," $FORMULA_FILE ||
              ! grep -qx "  sha256 \"$SHA256\"" $FORMULA_FILE; then
              echo "Error: $FORMULA_FILE has no url or sha256 line where the workflow looks for it"
              exit 1
            fi
          elif [ "$TOOL" = "tick" ]; then
            FORMULA_FILE="Formula/tick.rb"
            SHA256_ARM64="${{ github.event.client_payload.sha256_arm64 }}"
            SHA256_AMD64="${{ github.event.client_payload.sha256_amd64 }}"

            sed -i "s/version \".*\"/version \"$VERSION\"/" $FORMULA_FILE

            # Update arm64 sha256
            sed -i "/darwin_arm64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_ARM64\"/; }" $FORMULA_FILE

            # Update amd64 sha256
            sed -i "/darwin_amd64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_AMD64\"/; }" $FORMULA_FILE
          elif [ "$TOOL" = "portal" ]; then
            FORMULA_FILE="Formula/portal.rb"
            SHA256_ARM64="${{ github.event.client_payload.sha256_arm64 }}"
            SHA256_AMD64="${{ github.event.client_payload.sha256_amd64 }}"

            sed -i "s/version \".*\"/version \"$VERSION\"/" $FORMULA_FILE

            # Update arm64 sha256
            sed -i "/darwin_arm64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_ARM64\"/; }" $FORMULA_FILE

            # Update amd64 sha256
            sed -i "/darwin_amd64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_AMD64\"/; }" $FORMULA_FILE
          elif [ "$TOOL" = "mint" ]; then
            FORMULA_FILE="Formula/mint.rb"
            SHA256_ARM64="${{ github.event.client_payload.sha256_arm64 }}"
            SHA256_AMD64="${{ github.event.client_payload.sha256_amd64 }}"

            sed -i "s/version \".*\"/version \"$VERSION\"/" $FORMULA_FILE

            # Update arm64 sha256
            sed -i "/darwin_arm64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_ARM64\"/; }" $FORMULA_FILE

            # Update amd64 sha256
            sed -i "/darwin_amd64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_AMD64\"/; }" $FORMULA_FILE
          elif [ "$TOOL" = "switchboard" ]; then
            FORMULA_FILE="Formula/switchboard.rb"
            SHA256_ARM64="${{ github.event.client_payload.sha256_arm64 }}"
            SHA256_AMD64="${{ github.event.client_payload.sha256_amd64 }}"

            sed -i "s/version \".*\"/version \"$VERSION\"/" $FORMULA_FILE

            # Update arm64 sha256
            sed -i "/darwin_arm64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_ARM64\"/; }" $FORMULA_FILE

            # Update amd64 sha256
            sed -i "/darwin_amd64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_AMD64\"/; }" $FORMULA_FILE
          elif [ "$TOOL" = "kit" ]; then
            FORMULA_FILE="Formula/kit.rb"
            SHA256_ARM64="${{ github.event.client_payload.sha256_arm64 }}"
            SHA256_AMD64="${{ github.event.client_payload.sha256_amd64 }}"

            sed -i "s/version \".*\"/version \"$VERSION\"/" $FORMULA_FILE

            # Update arm64 sha256
            sed -i "/darwin_arm64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_ARM64\"/; }" $FORMULA_FILE

            # Update amd64 sha256
            sed -i "/darwin_amd64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_AMD64\"/; }" $FORMULA_FILE
          elif [ "$TOOL" = "sitrep" ]; then
            FORMULA_FILE="Casks/sitrep.rb"
            SHA256="$PAYLOAD_SHA256"

            if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $SHA256 =~ ^[0-9a-f]{64}$ ]]; then
              echo "Error: sitrep needs a version X.Y.Z and a sha256 of 64 hex digits; got '$VERSION', '$SHA256'"
              exit 1
            fi

            sed -i "s/^  version \"[0-9.]*\"$/  version \"$VERSION\"/" $FORMULA_FILE
            sed -i "s/^  sha256 \"[0-9a-f]*\"$/  sha256 \"$SHA256\"/" $FORMULA_FILE

            if ! grep -qx "  version \"$VERSION\"" $FORMULA_FILE ||
              ! grep -qx "  sha256 \"$SHA256\"" $FORMULA_FILE; then
              echo "Error: $FORMULA_FILE has no version or sha256 line where the workflow looks for it"
              exit 1
            fi
          elif [ "$TOOL" = "spaceman" ]; then
            FORMULA_FILE="Casks/spaceman.rb"
            SHA256="$PAYLOAD_SHA256"

            if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $SHA256 =~ ^[0-9a-f]{64}$ ]]; then
              echo "Error: spaceman needs a version X.Y.Z and a sha256 of 64 hex digits; got '$VERSION', '$SHA256'"
              exit 1
            fi

            sed -i "s/^  version \"[0-9.]*\"$/  version \"$VERSION\"/" $FORMULA_FILE
            sed -i "s/^  sha256 \"[0-9a-f]*\"$/  sha256 \"$SHA256\"/" $FORMULA_FILE

            if ! grep -qx "  version \"$VERSION\"" $FORMULA_FILE ||
              ! grep -qx "  sha256 \"$SHA256\"" $FORMULA_FILE; then
              echo "Error: $FORMULA_FILE has no version or sha256 line where the workflow looks for it"
              exit 1
            fi
          else
            echo "Error: unsupported tool '$TOOL'. Supported tools: stitch, press, stitch-bash, bash-toolkit, tick, portal, mint, switchboard, kit, sitrep, spaceman"
            exit 1
          fi

      - name: Commit changes
        env:
          PAYLOAD_TOOL: ${{ github.event.client_payload.tool }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          TOOL="$PAYLOAD_TOOL"
          VERSION="$PAYLOAD_VERSION"
          MESSAGE="Update $TOOL formula to v$VERSION"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if [ "$TOOL" = "bash-toolkit" ]; then
            git add Formula/bash-toolkit.rb
          elif [ "$TOOL" = "stitch" ]; then
            git add Formula/stitch.rb
          elif [ "$TOOL" = "press" ]; then
            git add Formula/press.rb
          elif [ "$TOOL" = "stitch-bash" ]; then
            git add Formula/stitch-bash.rb
          elif [ "$TOOL" = "tick" ]; then
            git add Formula/tick.rb
          elif [ "$TOOL" = "portal" ]; then
            git add Formula/portal.rb
          elif [ "$TOOL" = "mint" ]; then
            git add Formula/mint.rb
          elif [ "$TOOL" = "switchboard" ]; then
            git add Formula/switchboard.rb
          elif [ "$TOOL" = "kit" ]; then
            git add Formula/kit.rb
          elif [ "$TOOL" = "sitrep" ]; then
            git add Casks/sitrep.rb
            MESSAGE="Update $TOOL cask to v$VERSION"
          elif [ "$TOOL" = "spaceman" ]; then
            git add Casks/spaceman.rb
            MESSAGE="Update $TOOL cask to v$VERSION"
          fi

          git commit -m "$MESSAGE" || exit 0
          git push
