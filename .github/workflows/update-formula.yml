name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]

# One update at a time, so two dispatches close together can't race each
# other's git push; a queued one waits rather than being cancelled.
concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # sitrep's app/release waits on this run, so it must end.
    timeout-minutes: 5
    # Pushing the formula commit back to this repo needs write access, which the
    # built-in GITHUB_TOKEN grants once asked. This repo is the dispatch target,
    # not a sender, so it no longer holds a cross-repo PAT of its own.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Formula
        # The payload through the environment, never spliced into the script.
        env:
          PAYLOAD_TOOL: ${{ github.event.client_payload.tool }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_SHA256: ${{ github.event.client_payload.sha256 }}
          PAYLOAD_ASSET_ID: ${{ github.event.client_payload.asset_id }}
        run: |
          VERSION="$PAYLOAD_VERSION"
          TOOL="$PAYLOAD_TOOL"

          # Validate tool parameter
          if [ -z "$TOOL" ]; then
            echo "Error: tool parameter is required"
            exit 1
          fi

          # Set formula file and repository based on tool
          if [ "$TOOL" = "bash-toolkit" ]; then
            FORMULA_FILE="Formula/bash-toolkit.rb"
            REPO="leeovery/bash-toolkit"
            SHA256="${{ github.event.client_payload.sha256 }}"
            ASSET_ID="${{ github.event.client_payload.asset_id }}"

            RELEASE_URL="https://github.com/$REPO/releases/download/v$VERSION/$TOOL-v$VERSION.tar.gz"

            sed -i "s/version \".*\"/version \"$VERSION\"/" $FORMULA_FILE
            sed -i "s|url \".*\"|url \"$RELEASE_URL\"|" $FORMULA_FILE
            sed -i "s/sha256 \".*\"/sha256 \"$SHA256\"/" $FORMULA_FILE

            if grep -q "\"$VERSION\" =>" $FORMULA_FILE; then
              sed -i "s/\"$VERSION\" => \"[^\"]*\"/\"$VERSION\" => \"$ASSET_ID\"/" $FORMULA_FILE
            else
              sed -i "/asset_ids = {/a\\      \"$VERSION\" => \"$ASSET_ID\"," $FORMULA_FILE
            fi
          elif [ "$TOOL" = "stitch" ]; then
            FORMULA_FILE="Formula/stitch.rb"
            REPO="leeovery/stitch"
            SHA256="${{ github.event.client_payload.sha256 }}"
            ASSET_ID="${{ github.event.client_payload.asset_id }}"

            RELEASE_URL="https://github.com/$REPO/releases/download/v$VERSION/$TOOL-v$VERSION.tar.gz"

            sed -i "s/version \".*\"/version \"$VERSION\"/" $FORMULA_FILE
            sed -i "s|url \".*\"|url \"$RELEASE_URL\"|" $FORMULA_FILE
            sed -i "s/sha256 \".*\"/sha256 \"$SHA256\"/" $FORMULA_FILE

            if grep -q "\"$VERSION\" =>" $FORMULA_FILE; then
              sed -i "s/\"$VERSION\" => \"[^\"]*\"/\"$VERSION\" => \"$ASSET_ID\"/" $FORMULA_FILE
            else
              sed -i "/asset_ids = {/a\\      \"$VERSION\" => \"$ASSET_ID\"," $FORMULA_FILE
            fi
          elif [ "$TOOL" = "tick" ]; then
            FORMULA_FILE="Formula/tick.rb"
            SHA256_ARM64="${{ github.event.client_payload.sha256_arm64 }}"
            SHA256_AMD64="${{ github.event.client_payload.sha256_amd64 }}"

            sed -i "s/version \".*\"/version \"$VERSION\"/" $FORMULA_FILE

            # Update arm64 sha256
            sed -i "/darwin_arm64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_ARM64\"/; }" $FORMULA_FILE

            # Update amd64 sha256
            sed -i "/darwin_amd64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_AMD64\"/; }" $FORMULA_FILE
          elif [ "$TOOL" = "portal" ]; then
            FORMULA_FILE="Formula/portal.rb"
            SHA256_ARM64="${{ github.event.client_payload.sha256_arm64 }}"
            SHA256_AMD64="${{ github.event.client_payload.sha256_amd64 }}"

            sed -i "s/version \".*\"/version \"$VERSION\"/" $FORMULA_FILE

            # Update arm64 sha256
            sed -i "/darwin_arm64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_ARM64\"/; }" $FORMULA_FILE

            # Update amd64 sha256
            sed -i "/darwin_amd64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_AMD64\"/; }" $FORMULA_FILE
          elif [ "$TOOL" = "mint" ]; then
            FORMULA_FILE="Formula/mint.rb"
            SHA256_ARM64="${{ github.event.client_payload.sha256_arm64 }}"
            SHA256_AMD64="${{ github.event.client_payload.sha256_amd64 }}"

            sed -i "s/version \".*\"/version \"$VERSION\"/" $FORMULA_FILE

            # Update arm64 sha256
            sed -i "/darwin_arm64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_ARM64\"/; }" $FORMULA_FILE

            # Update amd64 sha256
            sed -i "/darwin_amd64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_AMD64\"/; }" $FORMULA_FILE
          elif [ "$TOOL" = "switchboard" ]; then
            FORMULA_FILE="Formula/switchboard.rb"
            SHA256_ARM64="${{ github.event.client_payload.sha256_arm64 }}"
            SHA256_AMD64="${{ github.event.client_payload.sha256_amd64 }}"

            sed -i "s/version \".*\"/version \"$VERSION\"/" $FORMULA_FILE

            # Update arm64 sha256
            sed -i "/darwin_arm64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_ARM64\"/; }" $FORMULA_FILE

            # Update amd64 sha256
            sed -i "/darwin_amd64/{ n; s/sha256 \".*\"/sha256 \"$SHA256_AMD64\"/; }" $FORMULA_FILE
          elif [ "$TOOL" = "sitrep" ]; then
            FORMULA_FILE="Casks/sitrep.rb"
            SHA256="$PAYLOAD_SHA256"
            ASSET_ID="$PAYLOAD_ASSET_ID"

            if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $SHA256 =~ ^[0-9a-f]{64}$ && $ASSET_ID =~ ^[0-9]+$ ]]; then
              echo "Error: sitrep needs a version X.Y.Z, a sha256 of 64 hex digits and a numeric asset_id; got '$VERSION', '$SHA256', '$ASSET_ID'"
              exit 1
            fi

            sed -i "s/^  asset_id = \"[0-9]*\"$/  asset_id = \"$ASSET_ID\"/" $FORMULA_FILE
            sed -i "s/^  version \"[0-9.]*\"$/  version \"$VERSION\"/" $FORMULA_FILE
            sed -i "s/^  sha256 \"[0-9a-f]*\"$/  sha256 \"$SHA256\"/" $FORMULA_FILE

            if ! grep -qx "  asset_id = \"$ASSET_ID\"" $FORMULA_FILE ||
              ! grep -qx "  version \"$VERSION\"" $FORMULA_FILE ||
              ! grep -qx "  sha256 \"$SHA256\"" $FORMULA_FILE; then
              echo "Error: $FORMULA_FILE has no asset_id, version or sha256 line where the workflow looks for it"
              exit 1
            fi
          else
            echo "Error: unsupported tool '$TOOL'. Supported tools: stitch, bash-toolkit, tick, portal, mint, switchboard, sitrep"
            exit 1
          fi

      - name: Commit changes
        env:
          PAYLOAD_TOOL: ${{ github.event.client_payload.tool }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          TOOL="$PAYLOAD_TOOL"
          VERSION="$PAYLOAD_VERSION"
          MESSAGE="Update $TOOL formula to v$VERSION"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if [ "$TOOL" = "bash-toolkit" ]; then
            git add Formula/bash-toolkit.rb
          elif [ "$TOOL" = "stitch" ]; then
            git add Formula/stitch.rb
          elif [ "$TOOL" = "tick" ]; then
            git add Formula/tick.rb
          elif [ "$TOOL" = "portal" ]; then
            git add Formula/portal.rb
          elif [ "$TOOL" = "mint" ]; then
            git add Formula/mint.rb
          elif [ "$TOOL" = "switchboard" ]; then
            git add Formula/switchboard.rb
          elif [ "$TOOL" = "sitrep" ]; then
            git add Casks/sitrep.rb
            MESSAGE="Update $TOOL cask to v$VERSION"
          fi

          git commit -m "$MESSAGE" || exit 0
          git push
